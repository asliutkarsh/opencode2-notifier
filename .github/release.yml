# Configures the auto-generated changelog for GitHub Releases
# (Release page -> "Generate release notes").
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Chores
      labels:
        - chore
        - dependencies
        - ci
